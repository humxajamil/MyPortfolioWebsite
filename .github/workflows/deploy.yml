name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify production output
        run: |
          test -f dist/index.html
          test -f dist/CNAME
          test -f dist/favicon.svg
          test -f dist/google62eb0be091f5aea1.html
          test -z "$(grep -R -E '/MyPortfolioWebsite/assets/|/assets/index-DXKekhl5.css|/assets/index-KDIcU-NG.js' dist/index.html dist/assets 2>/dev/null)"
          ! grep -R -E '<<<<<<<|=======|>>>>>>>' dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          if-no-files-found: error

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
